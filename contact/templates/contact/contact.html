<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <style>
        body {
    background-color: greenyellow;
    padding: 30px;
}

form {
    width: 400px;
    background-color: white;
    padding: 25px;
    border-radius: 10px;
}

h1 {
    color: darkblue;
}

label {
    display: block;
    margin-top: 15px;
    color: navy;
}

input,
textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid gray;
    border-radius: 20px;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    background-color: red;
    color: white;
    border: none;
    border-radius: 20px;
}

button:hover {
    background-color: darkblue;
}
    </style>
</head>
<body>
    

    <h1>Contact Us</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Send Message</button>
    </form>

</body>
</html>
