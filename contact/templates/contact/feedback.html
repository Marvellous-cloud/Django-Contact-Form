<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <style>
        body {
            font-family: Arial;
            background: lightgray;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        div {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid gray;
            border-radius: 30px;
        }

        h3 {
            margin-bottom: 5px;
        }

        p {
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <h1>Submitted Feedback</h1>

    {% for contact in contacts %}
        <div>
            <h3>{{ contact.name }}</h3>
            <p>{{ contact.email }}</p>
            <p>{{ contact.message }}</p>
        </div>
    {% empty %}
        <p>No feedback has been submitted yet.</p>
    {% endfor %}

</body>
</html>
